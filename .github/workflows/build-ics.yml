name: Build ICS systemimage for pana2_4a

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    container: ubuntu:14.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git curl python make gcc g++ openjdk-6-jdk \
            lib32z1 lib32ncurses5 lib32stdc++6 lib32bz2-1.0

      - name: Install repo (Python 2 compatible)
        run: |
          git clone https://gerrit.googlesource.com/git-repo /tmp/git-repo
          cd /tmp/git-repo
          git checkout v1.9.6
          cp repo /usr/local/bin/repo
          chmod +x /usr/local/bin/repo
          repo --version || true

      - name: Sync AOSP
        run: |
          mkdir -p ~/aosp
          cd ~/aosp
          repo init -u https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/manifest -b android-4.0.4_r2.1 --no-repo-verify
          repo sync -j4

      - name: Add device tree
        run: |
          mkdir -p ~/aosp/device/panasonic
          cp -r $GITHUB_WORKSPACE/porting/device/panasonic/pana2_4a ~/aosp/device/panasonic/pana2_4a

      - name: Build
        run: |
          cd ~/aosp
          source build/envsetup.sh
          lunch full_pana2_4a-eng
          make systemimage -j4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: systemimage
          path: /root/aosp/out/target/product/pana2_4a/system.img
          if-no-files-found: ignore