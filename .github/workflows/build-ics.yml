name: Build ICS systemimage for pana2_4a

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 make gcc g++ openjdk-8-jdk \
            lib32z1 lib32ncurses5 lib32stdc++6 lib32bz2-1.0

      - name: Install repo
        run: |
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod +x /usr/local/bin/repo
          repo --version

      - name: Sync AOSP
        run: |
          mkdir -p ~/aosp
          cd ~/aosp
          repo init -u https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/manifest -b android-4.0.4_r2.1 --no-clone-bundle
          repo sync -j4 --no-clone-bundle

      - name: Add device tree
        run: |
          cp -r $GITHUB_WORKSPACE/porting/device/panasonic/pana2_4a ~/aosp/device/panasonic/pana2_4a

      - name: Build
        run: |
          cd ~/aosp
          source build/envsetup.sh
          lunch full_pana2_4a-eng
          make systemimage -j4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: systemimage
          path: ~/aosp/out/target/product/pana2_4a/system.img
          if-no-files-found: ignore